<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tirupati &amp; Tirumala Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500&display=swap">
<style>
/* Layout: floating pill rail + organic blob panels on a soft neumorphic ground; painted SVG scenes stand in for photography. */
:root{
  /* Primaries */ --indigo:#1F2A5C; --mari:#E8A33D;
  /* Accents */ --teal:#2F7F7A; --kum:#C2413A; --lotus:#D98C86; --lilac:#8C86B8; --sand:#F3E6CF; --mist:#E4E7EF;
  --bg:#EEEDEA; --surf:#F8F7F4; --surf2:#E6E4DE; --ink:#1C2140; --mut:#6A6E85; --line:#DDDAD2;
  --btn:#1F2A5C; --btn-ink:#FFFFFF; --chip:#F3E6CF; --chip-ink:#5A4321; --head:#1F2A5C;
  --shd:rgba(31,42,92,.13); --shl:rgba(255,255,255,.95);
  --f-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Segoe Print',cursive;
  --r-xl:34px; --r-l:24px; --r-m:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --indigo:#AEB8F0; --mari:#F0B65A; --teal:#6CC1B8; --kum:#EF8A80; --lotus:#E7A9A3; --lilac:#B9B3E6; --sand:#3A3224; --mist:#262A3B;
  --bg:#12141D; --surf:#1B1E2B; --surf2:#242839; --ink:#ECEAF4; --mut:#A2A5BC; --line:#2E3247;
  --btn:#F0B65A; --btn-ink:#1B1E2B; --chip:#3A3224; --chip-ink:#F3D9A8; --head:#E8E4F6;
  --shd:rgba(0,0,0,.5); --shl:rgba(255,255,255,.035); color-scheme:dark}}
:root[data-theme="dark"]{
  --indigo:#AEB8F0; --mari:#F0B65A; --teal:#6CC1B8; --kum:#EF8A80; --lotus:#E7A9A3; --lilac:#B9B3E6; --sand:#3A3224; --mist:#262A3B;
  --bg:#12141D; --surf:#1B1E2B; --surf2:#242839; --ink:#ECEAF4; --mut:#A2A5BC; --line:#2E3247;
  --btn:#F0B65A; --btn-ink:#1B1E2B; --chip:#3A3224; --chip-ink:#F3D9A8; --head:#E8E4F6;
  --shd:rgba(0,0,0,.5); --shl:rgba(255,255,255,.035); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3,h4,.serif{font-family:var(--f-display);font-weight:400;font-synthesis:none;margin:0;text-wrap:balance;color:var(--head);letter-spacing:.005em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mari);outline-offset:3px;border-radius:10px}
.tab{font-variant-numeric:tabular-nums}

.soft{background:var(--surf);border-radius:var(--r-l);box-shadow:10px 12px 28px var(--shd),-8px -8px 22px var(--shl)}
.inset{background:var(--surf2);border-radius:var(--r-m);box-shadow:inset 3px 3px 8px var(--shd),inset -3px -3px 8px var(--shl)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:96px minmax(0,1fr);gap:28px;max-width:1360px;margin:0 auto}
.rail{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:48px}
.mark{display:grid;place-items:center;gap:2px;margin-bottom:12px;color:var(--indigo);text-align:center}
.mark svg{width:36px;height:30px}
.mark span{font:500 13px/1 var(--f-display);letter-spacing:.04em}
.nav{all:unset;box-sizing:border-box;cursor:pointer;width:70px;padding:12px 4px 10px;border-radius:22px;display:grid;justify-items:center;gap:6px;font:500 11.5px/1 var(--f-body);color:var(--mut);transition:background .25s,color .25s,transform .2s}
.nav{text-align:center;line-height:1.15}
.nav svg{width:22px;height:22px}
.nav:hover{color:var(--ink);transform:translateY(-1px)}
.nav.on{background:var(--btn);color:var(--btn-ink);box-shadow:0 10px 22px var(--shd)}
.nav:focus-visible{outline:2px solid var(--mari)}

.top{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.hello .eb{font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.hello h1{font-size:clamp(2.3rem,4.2vw,3.5rem);line-height:1}
.hello h1 i{font-style:italic;color:var(--mari)}
.hello p{color:var(--mut);margin-top:8px;max-width:52ch}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;font-size:13.5px;color:var(--mut)}
.pill b{color:var(--ink);font-weight:700}
.pill svg{width:18px;height:18px;color:var(--mari)}
.pill.wx{cursor:pointer;border:0}

#view{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}
.foot{margin-top:34px;display:flex;gap:10px;align-items:center;color:var(--mut);font-size:13px}
.foot svg{width:16px;height:16px;color:var(--mari);flex:none}

/* ---------- Painted art + photos ---------- */
.art{display:block;width:100%;height:100%}
.ph{display:block;width:100%;height:100%;object-fit:cover;background:var(--surf2)}
.hero .ph{position:absolute;inset:0;z-index:-2;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.darshan{position:relative;overflow:hidden;isolation:isolate;min-height:330px;border-radius:40px 96px 46px 76px;box-shadow:12px 14px 30px var(--shd),-8px -8px 20px var(--shl);background:#140E0A;color:#FFF3DE;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 30px}
.darshan .sl{position:absolute;inset:0;z-index:-2;opacity:0;transition:opacity 1.4s ease}
.darshan .sl.on{opacity:1}
.darshan .sl img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 7s ease-out}
.darshan .sl.on img{transform:scale(1.12)}
.darshan::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,12,8,0) 28%,rgba(20,12,8,.55) 58%,rgba(20,12,8,.92))}
.darshan .eb{font:600 11.5px var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:#F6D59A}
.darshan blockquote{margin:8px 0 0;font:400 italic clamp(1.8rem,2.8vw,2.4rem)/1.1 var(--f-display);color:#FFF3DE;max-width:20ch}
.darshan cite{display:block;margin-top:8px;font:400 13px var(--f-body);font-style:normal;color:#EADBC3;max-width:42ch}
.sdots{display:flex;gap:8px;margin-top:16px}
.sdots button{all:unset;cursor:pointer;width:8px;height:8px;border-radius:999px;background:rgba(255,243,222,.45);transition:width .3s,background .3s}
.sdots button.on{width:26px;background:#F6D59A}
.sdots button:focus-visible{outline:2px solid #F6D59A;outline-offset:3px}
.cl{animation:drift 22s ease-in-out infinite alternate}
.cl.b{animation-duration:30s;animation-direction:alternate-reverse}
.sunp{animation:glow 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes drift{to{transform:translateX(46px)}}
@keyframes glow{50%{transform:scale(1.14);opacity:.7}}

/* ---------- Home ---------- */
.home{display:grid;gap:26px}
.row1{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:26px}
.hero{position:relative;min-height:440px;overflow:hidden;isolation:isolate;
  border-radius:44px 150px 60px 120px / 60px 110px 90px 140px;box-shadow:16px 20px 40px var(--shd),-10px -10px 26px var(--shl);
  animation:morph 16s ease-in-out infinite alternate}
@keyframes morph{to{border-radius:120px 60px 140px 50px / 100px 60px 130px 70px}}
.hero .art{position:absolute;inset:0;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(14,18,44,.78) 0%,rgba(14,18,44,.42) 46%,rgba(14,18,44,0) 72%)}
.hero-in{padding:52px 48px;max-width:520px;color:#FFF6E6;display:flex;flex-direction:column;gap:14px}
.hero-in .eb{font:600 11.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#F6D9A2}
.hero-in h2{color:#FFF6E6;font-size:clamp(3rem,6vw,5.2rem);line-height:.9}
.hero-in h2 + .serif{color:#FFF6E6;font-size:1.7rem;font-style:italic;margin-top:-4px}
.hero-in p{color:#F1E5D2;max-width:40ch}
.cta{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;font:600 14px var(--f-body);transition:transform .2s,box-shadow .2s}
.cta svg{width:18px;height:18px}
.cta.glass{background:rgba(255,246,230,.16);border:1px solid rgba(255,246,230,.55);color:#FFF6E6;backdrop-filter:blur(6px);align-self:flex-start;margin-top:8px}
.cta.glass:hover{background:rgba(255,246,230,.28);transform:translateX(2px)}
.cta.solid{background:var(--btn);color:var(--btn-ink);box-shadow:0 10px 22px var(--shd)}
.cta.solid:hover{transform:translateY(-1px)}
.cta:focus-visible{outline:2px solid var(--mari);outline-offset:3px}
.thumbs{display:flex;gap:10px;margin-top:10px;align-items:center}
.thumbs button{all:unset;cursor:pointer;width:54px;height:54px;border-radius:50%;overflow:hidden;border:2.5px solid rgba(255,246,230,.85);box-shadow:0 6px 16px rgba(0,0,0,.25);transition:transform .2s}
.thumbs button:hover{transform:scale(1.08)}
.thumbs span{font-size:12.5px;color:#F6D9A2;margin-left:4px}

.side{display:grid;gap:22px;align-content:start;position:relative}
.hand{font:500 2.1rem/1 var(--f-hand);color:var(--indigo);transform:rotate(-8deg);position:absolute;top:-30px;left:-40px;z-index:2;pointer-events:none}
.hand svg{width:28px;height:28px;color:var(--mari);vertical-align:-4px}
.wxb{position:relative;overflow:hidden;isolation:isolate;min-height:270px;padding:30px 30px 24px;color:#fff;
  border-radius:120px 70px 110px 60px / 90px 80px 120px 70px;box-shadow:14px 18px 34px var(--shd),-8px -8px 22px var(--shl);animation:morph2 14s ease-in-out infinite alternate}
@keyframes morph2{to{border-radius:70px 120px 60px 110px / 80px 120px 70px 100px}}
.wxb .art{position:absolute;inset:0;z-index:-1}
.wx-t{font:400 clamp(4rem,7vw,5.4rem)/.9 var(--f-display);color:#fff}
.wx-c{font:600 16px var(--f-body);margin-top:4px}
.wx-m{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:10px;color:rgba(255,255,255,.88)}
.wx-m span{display:flex;align-items:center;gap:5px}.wx-m svg{width:14px;height:14px}
.wx-loc{display:inline-flex;gap:6px;align-items:center;margin-top:16px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.9);color:#1F2A5C;font:600 12.5px var(--f-body)}
.wx-loc svg{width:14px;height:14px;color:#C2413A}
.wx-sub{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;font-size:12px;color:rgba(255,255,255,.85)}
.wx-sub button{all:unset;cursor:pointer;display:flex;gap:5px;align-items:center;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.18)}
.wx-sub svg{width:13px;height:13px}
.wx-two{display:flex;justify-content:space-between;gap:12px;padding:16px 20px;align-items:center}
.wx-two b{font:400 2rem/1 var(--f-display);color:var(--head)}
.wx-two small{display:block;color:var(--mut);font-size:12.5px}

.next{padding:22px 22px 20px;display:grid;gap:14px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hd h3{font-size:1.55rem}
.link{all:unset;cursor:pointer;font:600 12.5px var(--f-body);color:var(--indigo);display:inline-flex;gap:6px;align-items:center}
.link svg{width:15px;height:15px}
.link:hover{text-decoration:underline}
.nx{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center}
.nx .th{width:76px;height:76px;border-radius:20px;overflow:hidden}
.nx b{font-weight:600}
.nx small{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px;margin-top:4px}
.nx small svg{width:14px;height:14px}
.round{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surf);box-shadow:5px 5px 12px var(--shd),-4px -4px 10px var(--shl);color:var(--ink);transition:transform .2s}
.round:hover{transform:translateX(2px)}
.round svg{width:18px;height:18px}

.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:4px 6px 16px}
.sec-h h2{font-size:clamp(1.9rem,3vw,2.4rem);line-height:1.05}
.sec-h p{color:var(--mut);font-size:13.5px;margin-top:4px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.dc{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 12px 16px;display:grid;gap:12px;border-radius:26px;background:var(--surf);box-shadow:10px 12px 26px var(--shd),-8px -8px 20px var(--shl);transition:transform .25s}
.dc:hover{transform:translateY(-4px)}
.dc:focus-visible{outline:2px solid var(--mari);outline-offset:3px}
.dc .th{height:128px;border-radius:18px;overflow:hidden}
.dc .meta{padding:0 6px;display:grid;gap:2px}
.dc .d{font:700 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mari)}
.dc h4{font-size:1.4rem;line-height:1.1;margin-top:4px}
.dc small{color:var(--mut);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dc small i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--indigo)}
.dc small i svg{width:15px;height:15px}

.row3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.95fr);gap:22px}
.quote{position:relative;overflow:hidden;isolation:isolate;min-height:250px;padding:30px;border-radius:40px 90px 46px 70px;color:#1F2A5C;box-shadow:12px 14px 30px var(--shd),-8px -8px 20px var(--shl)}
.quote .art{position:absolute;inset:0;z-index:-1}
.quote::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,250,240,.86),rgba(255,250,240,.35) 62%,rgba(255,250,240,0))}
.quote .eb{font:600 11.5px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#7B5A1E}
.quote blockquote{margin:10px 0 0;font:400 italic clamp(1.7rem,2.6vw,2.2rem)/1.15 var(--f-display);color:#1F2A5C;max-width:18ch}
.quote cite{display:block;margin-top:10px;font:500 12.5px var(--f-body);font-style:normal;color:#4A4F6E}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tiles .tile:first-child{grid-column:1/-1;grid-template-columns:auto 1fr;justify-items:start;text-align:left;align-items:center;column-gap:14px}.tiles .tile:first-child i{grid-row:span 2}.tiles .tile:first-child small{margin-top:0}
.tile{all:unset;box-sizing:border-box;cursor:pointer;padding:18px 12px;border-radius:26px;display:grid;justify-items:center;gap:10px;text-align:center;background:var(--surf);box-shadow:8px 10px 22px var(--shd),-7px -7px 18px var(--shl);font:600 13px var(--f-body);transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.tile:focus-visible{outline:2px solid var(--mari)}
.tile i{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;font-style:normal}
.tile i svg{width:24px;height:24px}
.tile small{display:block;font-weight:400;color:var(--mut);font-size:11.5px;margin-top:-6px}
.mini{padding:24px;display:grid;gap:12px;align-content:start}
.big{font:400 2.7rem/1 var(--f-display);color:var(--head)}
.bar{height:12px;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--mari));transition:width .8s cubic-bezier(.2,.7,.2,1)}
.mut{color:var(--mut);font-size:13px}

/* ---------- Itinerary ---------- */
.dayrow{display:flex;gap:12px;overflow-x:auto;padding:6px 4px 18px;margin:0 -4px 8px;scrollbar-width:thin}
.dp{all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:flex;gap:12px;align-items:center;padding:10px 20px 10px 10px;border-radius:999px;background:var(--surf);box-shadow:6px 8px 18px var(--shd),-6px -6px 14px var(--shl);transition:background .25s,color .25s}
.dp .th{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none}
.dp b{display:block;font:600 14px var(--f-body)}
.dp small{display:block;color:var(--mut);font-size:12px}
.dp.on{background:var(--btn);color:var(--btn-ink)}
.dp.on small{color:inherit;opacity:.78}
.dp:focus-visible{outline:2px solid var(--mari);outline-offset:3px}
.itin{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.35fr);gap:26px;align-items:start}
.dayhero{overflow:hidden;position:sticky;top:20px}
.dayhero .th{height:240px;border-radius:24px 24px 60px 24px;overflow:hidden;margin:12px 12px 0}
.dayhero .bd{padding:22px 26px 26px;display:grid;gap:14px}
.dayhero h2{font-size:clamp(2rem,3vw,2.6rem);line-height:1.02}
.dayhero .d{font:700 11.5px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--mari)}
.dayhero p{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font:500 12.5px var(--f-body)}
.stay{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut);padding-top:12px;border-top:1px solid var(--line)}
.stay svg{width:18px;height:18px;color:var(--teal);flex:none}
.tl{padding:26px 26px 18px}
.tl ol{list-style:none;margin:0;padding:0;position:relative}
.tl ol::before{content:"";position:absolute;left:111px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--mari),var(--teal));opacity:.35;border-radius:2px}
.tl li{display:grid;grid-template-columns:96px 30px minmax(0,1fr);gap:0 0;padding:10px 0;animation:rise .4s both}
.tl time{font:600 12.5px/1.4 var(--f-body);color:var(--indigo);padding-top:2px;font-variant-numeric:tabular-nums}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--surf);border:2.5px solid var(--mari);margin:5px 0 0 9px;position:relative;z-index:1}
.tl li.key .dot{background:var(--mari);box-shadow:0 0 0 5px color-mix(in srgb,var(--mari) 25%,transparent)}
.tl .tx b{font-weight:600}
.tl .tx small{display:block;color:var(--mut);font-size:13px;line-height:1.45;margin-top:2px}
.callouts{display:grid;gap:16px;margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.call{padding:20px 22px;border-radius:24px}
.call h4{font-size:1.4rem;margin-bottom:8px}
.call ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.call.a{background:color-mix(in srgb,var(--mari) 14%,var(--surf))}
.call.b{background:color-mix(in srgb,var(--teal) 13%,var(--surf))}
.call.c{background:color-mix(in srgb,var(--lilac) 16%,var(--surf))}
.call.d{background:color-mix(in srgb,var(--kum) 10%,var(--surf))}

/* ---------- Places ---------- */
.seg{display:inline-flex;gap:4px;padding:5px;border-radius:999px;margin-bottom:22px}
.seg button{all:unset;cursor:pointer;padding:10px 20px;border-radius:999px;font:600 13.5px var(--f-body);color:var(--mut);display:flex;gap:8px;align-items:center;transition:background .25s,color .25s}

  '<form id="exf" novalidate><label class="amt-in inset"><span>₹</span><input id="ex-amt" type="number" inputmode="decimal" min="1" step="1" placeholder="0" aria-label="Amount in rupees"></label>'+
  '<label class="fld"><span>What for</span><input class="txt inset" id="ex-item" placeholder="Cab to Tirumala, lunch, nappies…" maxlength="80"></label>'+
  '<div class="quick">'+QUICK.map(function(q){return '<button type="button" data-q="'+q[0]+'" data-qc="'+q[1]+'">'+q[0]+'</button>'}).join('')+'</div>'+
  '<div class="fld"><span>Who paid <em class="hint">· tick more than one to split equally</em></span><div class="opts">'+PAYERS.map(function(p,i){return '<label><input type="checkbox" name="ex-who" id="ex-who-'+i+'" value="'+p[0]+'"'+(S.lastWho.indexOf(p[0])>-1?' checked':'')+'><span>'+esc(pname(p[0]))+'</span></label>'}).join('')+'</div></div>'+
  '<div class="fld"><span>Category</span><div class="opts">'+CATS.map(function(c,i){return '<label><input type="radio" name="ex-cat" id="ex-cat-'+i+'" value="'+c[0]+'"'+(i===0?' checked':'')+'><span>'+c[0]+'</span></label>'}).join('')+'</div></div>'+
  '<div class="fld"><span>Day</span><div class="opts">'+DAYOPTS.map(function(d,i){return '<label><input type="radio" name="ex-day" id="ex-day-'+i+'" value="'+d+'"'+(d===ad?' checked':'')+'><span>'+d+'</span></label>'}).join('')+'</div></div>'+
  '<p class="err" id="ex-err"></p><div class="acts"><button type="button" class="ghost" data-act="close">Cancel</button><button class="cta solid" type="submit">'+ic('plus',2.2)+'Save expense</button></div></form></div></div>';
  s.hidden=false;setTimeout(function(){var a=$('#ex-amt');if(a)a.focus()},60)}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}
function addExpense(e){
  if(shared&&DB){DB.collection('expenses').add(e).then(function(){toast('Saved · '+inr(e.amt))}).catch(function(err){S.exp.unshift(Object.assign({id:'l'+Date.now()},e));saveLocal();show();toast(err&&err.code==='quota_exceeded'?'Shared log is full; saved on this device':'Saved on this device only')})}
  else{S.exp.unshift(Object.assign({id:'l'+Date.now()},e));saveLocal();show();toast('Saved · '+inr(e.amt))}}
function delExpense(id){
  if(shared&&DB&&id.charAt(0)!=='l'){DB.collection('expenses').doc(id).delete().then(function(){toast('Deleted')}).catch(function(){toast('Could not delete. Try again.')})}
  else{S.exp=S.exp.filter(function(x){return x.id!==id});saveLocal();show();toast('Deleted')}}

/* ---------------- Events ---------------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-go],[data-day],[data-pl],[data-who],[data-del],[data-q],[data-f],[data-sl],[data-jump],#fab,#wxpill');if(!t)return;
  if(t.id==='fab')return openSheet();
  if(t.id==='wxpill')return go('home');
  var a=t.dataset.act;
  if(a==='close'){if(e.target===t||t.tagName==='BUTTON')closeSheet();return}
  if(a==='add')return openSheet();
  if(a==='wx')return loadWx();
  if(t.dataset.q){$('#ex-item').value=t.dataset.q;var r=document.querySelector('input[name="ex-cat"][value="'+t.dataset.qc+'"]');if(r)r.checked=true;$('#ex-amt').focus();return}
  if(t.dataset.del){if(t.classList.contains('sure'))return delExpense(t.dataset.del);document.querySelectorAll('.del.sure').forEach(function(b){b.classList.remove('sure');b.innerHTML=ic('x',2)});t.classList.add('sure');t.textContent='Delete?';setTimeout(function(){if(t.isConnected&&t.classList.contains('sure')){t.classList.remove('sure');t.innerHTML=ic('x',2)}},3500);return}
  if(t.dataset.jump){e.preventDefault();var el=document.getElementById(t.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.f){S.filter=t.dataset.f;var y0=window.scrollY;show();window.scrollTo(0,y0);return}
  if(t.dataset.sl!=null){setSlide(+t.dataset.sl);startSlides();return}
  if(t.dataset.pl){S.place=t.dataset.pl;if(t.dataset.go)return go('places');show();return}
  if(t.dataset.who){S.who=t.dataset.who;show();return}
  if(t.dataset.day!=null&&t.dataset.go!=null){S.day=+t.dataset.day;return go(t.dataset.go)}
  if(t.dataset.day!=null){S.day=+t.dataset.day;show();var dr=$('.dayrow .on');if(dr)dr.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});return}
  if(t.dataset.go)return go(t.dataset.go);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('change',function(e){var id=e.target.dataset&&e.target.dataset.ck;if(!id)return;S.checks[id]=e.target.checked;if(!e.target.checked)delete S.checks[id];saveLocal();
  var y=window.scrollY;show();window.scrollTo(0,y);var el=document.querySelector('[data-ck="'+id+'"]');if(el)el.focus();
  if(shared&&DB){clearTimeout(chkTimer);chkTimer=setTimeout(function(){DB.doc('trip/packing').set({c:S.checks}).catch(function(){})},700)}});
document.addEventListener('submit',function(e){if(e.target.id!=='exf')return;e.preventDefault();
  var amt=parseFloat($('#ex-amt').value),item=$('#ex-item').value.trim();
  if(!(amt>0)){$('#ex-err').textContent='Enter the amount you paid, in rupees.';$('#ex-amt').focus();return}
  var who=[].map.call(document.querySelectorAll('input[name="ex-who"]:checked'),function(x){return x.value});
  if(!who.length){$('#ex-err').textContent='Tick who paid. Tick more than one person to split the bill.';return}
  var c=(document.querySelector('input[name="ex-cat"]:checked')||{}).value||'Other',d=(document.querySelector('input[name="ex-day"]:checked')||{}).value||autoDay();
  S.lastWho=who;saveLocal();
  addExpense({item:item||c,cat:c,amt:Math.round(amt),day:d,who:who,ts:Date.now()});closeSheet()});
document.addEventListener('change',function(e){var id=e.target.dataset&&e.target.dataset.nm;if(!id)return;var v=e.target.value.trim().slice(0,20);if(v)S.names[id]=v;else delete S.names[id];saveLocal();
  if(shared&&DB){DB.doc('trip/people').set({names:S.names}).catch(function(){})}var y=window.scrollY;show();window.scrollTo(0,y);toast('Name saved')});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.nm){e.preventDefault();e.target.blur()}});

/* ---------------- Shared storage ---------------- */
show(false);loadWx();setInterval(loadWx,15*60*1000);setInterval(function(){$('#cd').innerHTML=countdown();paintNow()},60000);
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('db').then(function(db){if(!db)return;DB=db;
    db.collection('expenses').orderBy('ts','desc').onSnapshot(function(snap){shared=true;var local=S.exp.filter(function(x){return String(x.id).charAt(0)==='l'});
      S.exp=local.concat(snap.docs.map(function(d){return Object.assign({id:d.id},d.data())})).sort(function(a,b){return (b.ts||0)-(a.ts||0)});
      if(S.view==='budget'||S.view==='home'){var y=window.scrollY;show();window.scrollTo(0,y)}},function(){shared=false});
    db.doc('trip/people').onSnapshot(function(s){if(s.exists){S.names=Object.assign({},s.data().names||{});saveLocal();if(S.view==='budget'&&!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.nm)){var y=window.scrollY;show();window.scrollTo(0,y)}}},function(){});
    db.doc('trip/packing').onSnapshot(function(s){if(s.exists){var c=s.data().c||{};S.checks=Object.assign({},c);saveLocal();if(S.view==='pack'){var y=window.scrollY;show();window.scrollTo(0,y)}}},function(){});
  }).catch(function(){})}
})();
</script>

</body></html>
